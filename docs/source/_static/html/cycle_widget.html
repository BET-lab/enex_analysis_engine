<style>
    .cycle-widget-container {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        border: 1px solid var(--sy-c-border, #eaecef);
        border-radius: 8px;
        padding: 16px;
        background-color: var(--sy-c-bg, #ffffff);
        margin: 20px 0;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .widget-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-bottom: 20px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--sy-c-border, #eaecef);
    }
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
        min-width: 200px;
    }
    .control-group label {
        font-weight: 600;
        font-size: 0.9em;
        color: var(--sy-c-text, #24292e);
    }
    .control-group select {
        padding: 8px;
        border-radius: 4px;
        border: 1px solid var(--sy-c-border, #eaecef);
        background-color: var(--sy-c-bg, #ffffff);
        color: var(--sy-c-text, #24292e);
        font-size: 0.95em;
    }
    .slider-container {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .slider-container input[type="range"] {
        flex-grow: 1;
    }
    .slider-value {
        font-weight: 500;
        min-width: 45px;
        text-align: right;
        color: var(--sy-c-text, #24292e);
    }
    
    /* Button Group for Diagram Type */
    .diagram-selector {
        display: flex;
        justify-content: center;
        margin-bottom: 15px;
        gap: 10px;
    }
    
    .diagram-btn {
        padding: 8px 16px;
        background-color: transparent;
        border: 1px solid var(--sy-c-border, #eaecef);
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        color: var(--sy-c-text, #24292e);
        transition: all 0.2s ease;
    }
    
    .diagram-btn:hover {
        background-color: var(--sy-c-bg-hover, #f6f8fa);
    }
    
    .diagram-btn.active {
        background-color: var(--sy-c-primary, #0969da);
        color: white;
        border-color: var(--sy-c-primary, #0969da);
    }

    .plot-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        min-height: auto;
    }
    .plot-container img {
        width: 100%;
        height: auto;
        border-radius: 4px;
        transition: opacity 0.2s ease-in-out;
    }
    
    /* For error state */
    .error-message {
        color: var(--sy-c-danger, #dc3545);
        text-align: center;
        padding: 20px;
        background-color: rgba(220, 53, 69, 0.1);
        border-radius: 4px;
        display: none;
    }
</style>

<div class="cycle-widget-container">
    <div class="widget-controls">
        <div class="control-group">
            <label for="refSelect">Refrigerant</label>
            <select id="refSelect">
                <option value="R410A">R410A</option>
                <option value="R134a">R134a</option>
                <option value="R32">R32</option>
                <option value="R290">R290</option>
            </select>
        </div>
        
        <div class="control-group">
            <label for="tsourceSlider">Source Temperature (T<sub>source</sub>)</label>
            <div class="slider-container">
                <input type="range" id="tsourceSlider" min="-15" max="15" step="5" value="0">
                <span class="slider-value" id="tsourceVal">0&deg;C</span>
            </div>
        </div>
        
        <div class="control-group">
            <label for="tsinkSlider">Sink Temperature (T<sub>sink</sub>)</label>
            <div class="slider-container">
                <input type="range" id="tsinkSlider" min="25" max="55" step="5" value="40">
                <span class="slider-value" id="tsinkVal">40&deg;C</span>
            </div>
        </div>
    </div>
    
    <div class="diagram-selector" id="diagramSelector">
        <button class="diagram-btn active" data-type="th">T-h Diagram</button>
        <button class="diagram-btn" data-type="ph">P-h Diagram</button>
        <button class="diagram-btn" data-type="ts">T-s Diagram</button>
    </div>

    <div class="plot-container">
        <div class="error-message" id="plotError">Plot not available for this configuration. (Ensure T<sub>sink</sub> > T<sub>source</sub>)</div>
        <img id="cyclePlot" src="" alt="Thermodynamic Cycle Diagram">
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const refSelect = document.getElementById('refSelect');
    const tsourceSlider = document.getElementById('tsourceSlider');
    const tsinkSlider = document.getElementById('tsinkSlider');
    const tsourceVal = document.getElementById('tsourceVal');
    const tsinkVal = document.getElementById('tsinkVal');
    const cyclePlot = document.getElementById('cyclePlot');
    const plotError = document.getElementById('plotError');
    const diagramBtns = document.querySelectorAll('.diagram-btn');
    
    let currentType = 'th';

    // Base path relative to where this HTML is embedded
    // When embedded in docs/source/theory/components/refrigerant_cycle.html
    // The relative path from the built HTML to the static folder is ../../_static/
    const basePath = '../../_static/interactive_plots';

    function updatePlot() {
        const ref = refSelect.value;
        const tsource = parseInt(tsourceSlider.value);
        const tsink = parseInt(tsinkSlider.value);
        
        tsourceVal.innerHTML = `${tsource}&deg;C`;
        tsinkVal.innerHTML = `${tsink}&deg;C`;
        
        // Map to internal Evaporation and Condensation temperatures based on 5K difference
        const tevap = tsource - 5;
        const tcond = tsink + 5;
        
        // Prevent physical impossibility or generation errors
        if (tcond <= tevap) {
            cyclePlot.style.display = 'none';
            plotError.style.display = 'block';
            return;
        }
        
        cyclePlot.style.display = 'block';
        plotError.style.display = 'none';
        
        // Construct filename: type_ref_tsource_tsink.png
        const filename = `${currentType}_${ref}_${tsource}_${tsink}.png`;
        const newSrc = `${basePath}/${filename}`;
        
        // Simple transition effect
        cyclePlot.style.opacity = 0.5;
        
        const tempImg = new Image();
        tempImg.onload = () => {
            cyclePlot.src = newSrc;
            cyclePlot.style.opacity = 1;
        };
        tempImg.onerror = () => {
            cyclePlot.style.display = 'none';
            plotError.style.display = 'block';
            plotError.innerText = `Image not found: ${filename}`;
        };
        tempImg.src = newSrc;
    }

    refSelect.addEventListener('change', updatePlot);
    tsourceSlider.addEventListener('input', updatePlot);
    tsinkSlider.addEventListener('input', updatePlot);
    
    diagramBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            diagramBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentType = e.target.getAttribute('data-type');
            updatePlot();
        });
    });

    // Initialize
    updatePlot();
});
</script>
